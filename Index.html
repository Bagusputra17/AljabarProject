<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#fff;font-family:Arial,sans-serif}
.loading{text-align:center}
.spinner{width:48px;height:48px;margin:0 auto 16px;border:5px solid #e5e5e5;border-top-color:#333;border-radius:50%;animation:spin .8s linear infinite}
.text{font-size:16px;color:#333;margin-bottom:8px}
.network{font-size:14px;color:#777}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading">
  <div class="spinner"></div>
  <div class="text">Loading...</div>
  <div class="network">Jaringan anda tidak stabil</div>
</div>
</body>
</html>
